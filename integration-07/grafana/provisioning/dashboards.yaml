apiVersion: 1

providers:
  - name: NimbusNet
    orgId: 1
    folder: NimbusNet
    folderUid: nimbusnet
    type: file
    disableDeletion: true
    updateIntervalSeconds: 30
    allowUiUpdates: false
    options:
      path: /etc/grafana/provisioning/dashboards/nimbusnet
      foldersFromFilesStructure: false
