server:
  http_listen_port: 9080
  grpc_listen_port: 0
  log_level: warn

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:

  # Docker container logs
  - job_name: docker-containers
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 5s
        filters:
          - name: label
            values: ["com.docker.compose.project=nimbusnet"]
    relabel_configs:
      - source_labels: [__meta_docker_container_name]
        regex: "/(.*)"
        target_label: container
      - source_labels: [__meta_docker_container_label_com_docker_compose_service]
        target_label: service
      - source_labels: [__meta_docker_container_log_stream]
        target_label: stream

  # NimbusNet Go agent logs (Phase 2+)
  # These will be structured JSON — Loki pipeline extracts fields
  - job_name: nimbusnet-agent
    static_configs:
      - targets: ["localhost"]
        labels:
          job: nimbusnet-agent
          __path__: /var/log/nimbusnet/agent/*.log
    pipeline_stages:
      - json:
          expressions:
            level: level
            region: region
            incident_id: incident_id
            state: state
            action: action
            duration_ms: duration_ms
      - labels:
          level:
          region:
          state:
      - timestamp:
          source: timestamp
          format: RFC3339Nano

  # System logs
  - job_name: system
    static_configs:
      - targets: ["localhost"]
        labels:
          job: system
          __path__: /var/log/syslog
